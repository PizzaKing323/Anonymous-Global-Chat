
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anonymous Global Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eeeeF5;
    }

    header {
      background: #24243e;
      color: white;
      padding: 18px;
      text-align: center;
    }

    #online {
      color: #9affb2;
      font-size: 14px;
    }

    #chat {
      height: calc(100vh - 165px);
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      background: white;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 12px;
      max-width: 600px;
      overflow-wrap: anywhere;
    }

    .username {
      font-weight: bold;
      color: #5757c9;
      margin-bottom: 5px;
    }

    .message img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 8px;
      margin-top: 8px;
    }

    #controls {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: white;
      position: fixed;
      bottom: 0;
      width: 100%;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button, .upload {
      border: none;
      background: #5757c9;
      color: white;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .upload input {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h2>🌎 Anonymous Global Chat</h2>
  <div id="online">Connecting...</div>
</header>

<div id="chat"></div>

<div id="controls">
  <label class="upload">
    📷
    <input type="file" id="imageInput"
      accept="image/png,image/jpeg,image/gif,image/webp">
  </label>

  <input
    id="messageInput"
    type="text"
    maxlength="500"
    placeholder="Type a message..."
  >

  <button id="sendButton">Send</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

</body>
</html>
